---
layout: default
---
<article class="wrap">

  {% if page.title %}
    <header class="page-header">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.intro %}<p class="page-header__intro">{{ page.intro }}</p>{% endif %}
    </header>
  {% endif %}

  <div class="prose">
    {{ content }}
  </div>

</article>
