# Publications.
#
# TO ADD A PAPER: copy a block below and drop a thumbnail in images/papers/.
# Nothing else needs editing — /papers/ renders one combined list, grouped and
# sorted by year, so where the entry sits in this file only decides its order
# within its own year.
#
# Fields
#   year     required, drives the year headings and sort order
#   title    required
#   authors  plain text; "K H Rankin" is bolded automatically, so write your
#            name exactly that way
#   venue    journal or conference name
#   type     journal | conference — metadata only, not rendered and not used
#            for grouping
#   doi      full https://doi.org/... URL
#   pdf      e.g. /files/my-paper.pdf  (drop the PDF in files/)
#   code     repository URL
#   data     dataset URL
#   note     one line for an award or a real-world impact
#   links    extra chips: - {label: "Forbes", url: "https://..."}
#   thumb    /images/papers/<name>.svg|.png — omit and it falls back to a
#            neutral placeholder rather than breaking

- year: 2026
  type: journal
  title: "The climate limits of construction in over 1,000 cities"
  authors: "Keagan Hudson Rankin, Andre Cabrera Serrenho, Chris Bachmann, I. Daniel Posen, Shoshanna Saxe."
  venue: "Nature Cities"
  doi: "https://doi.org/10.1038/s44284-025-00379-8"
  note: "The construction and maintenance of cities is the largest undertaking (by mass) of human society. 
         Despite this, cities don't know how their construction activities affect the environment, nor do they have plans to reduce their impacts.
         We find this information for over 1000+ cities across the world."
  thumb: /images/papers/budgets_fig2.png
  links:
    - {label: "Forbes Article", url: "https://www.forbes.com/sites/lauriewinkless/2026/02/15/urban-construction-boom-threatens-climate-goals/"}

- year: 2024
  type: journal
  title: "A future growth model for building more housing and infrastructure with less embodied greenhouse gas emissions"
  authors: "Keagan Hudson Rankin, Shoshanna Saxe"
  venue: "Environmental Science & Technology"
  doi: "https://doi.org/10.1021/acs.est.4c02070"
  note: "We create The Future Infrastructure Growth (FIG) model. This model takes advantage of widespread census data and the assumption that
         future neighbourhoods will probably be laid out like current ones. We sample a bunch of existing neighbourhoods, quantify their emissions, and then
         use this to simulate future development."
  # Reusing the existing starts_forecast.png — confirm this figure belongs to
  # this paper, or swap it for the right one.
  thumb: /images/papers/fig_abstract.png
  links:
  
- year: 2024
  type: journal
  title: "Embodied GHG of missing middle: residential building forms and strategies for more efficient housing"
  authors: "Keagan Hudson Rankin, Aldrick Arceo, Kaan Isin, Shoshanna Saxe"
  venue: "Journal of Industrial Ecology"
  doi: "https://doi.org/10.1111/jiec.13461"
  note: "Researchers have made a lot of assumptions around what types of housing (e.g. single family vs. multi-unit low rise vs. highrise towers)
         might have more or less GHG impact. We collected a bunch of data to actually test these assumptions. We found, suprisingly, that how you design
         a building is way more important than the form of the building in reducing life-cycle emissions (though multi-unit buildings have less embodied emissions
         on average)."
  thumb: /images/papers/mat_contents.png
  links:
    - {label: "Toronto housing options policy", url: "https://www.toronto.ca/city-government/planning-development/planning-studies-initiatives/expanding-housing-options/"}


